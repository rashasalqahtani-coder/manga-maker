openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rorym
    description: Rorym local manga source
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rorym/home:
    get:
      operationId: getRorymHome
      tags: [rorym]
      summary: Get all manga from Rorym
      responses:
        "200":
          description: List of manga
          content:
            application/json:
              schema:
                type: object
                required: [manga]
                properties:
                  manga:
                    type: array
                    items:
                      $ref: "#/components/schemas/RorymManga"

  /rorym/most-read:
    get:
      operationId: getRorymMostRead
      tags: [rorym]
      summary: Get manga selected by translation teams for the most-read section
      responses:
        "200":
          description: Most-read manga list
          content:
            application/json:
              schema:
                type: object
                required: [manga]
                properties:
                  manga:
                    type: array
                    items:
                      $ref: "#/components/schemas/RorymManga"

  /rorym/genres/{genre}:
    get:
      operationId: getRorymMangaByGenre
      tags: [rorym]
      summary: Get manga that share a genre
      parameters:
        - name: genre
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manga in the selected genre
          content:
            application/json:
              schema:
                type: object
                required: [genre, manga]
                properties:
                  genre:
                    type: string
                  manga:
                    type: array
                    items:
                      $ref: "#/components/schemas/RorymManga"

  /rorym/search:
    get:
      operationId: searchRorym
      tags: [rorym]
      summary: Search manga by title
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/RorymManga"

  /rorym/manga/{slug}:
    get:
      operationId: getRorymManga
      tags: [rorym]
      summary: Get single manga detail
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manga detail
          content:
            application/json:
              schema:
                type: object
                required: [manga]
                properties:
                  manga:
                    $ref: "#/components/schemas/RorymManga"
    patch:
      operationId: updateRorymMangaPlacement
      tags: [rorym]
      summary: Let the owning translation team control most-read placement
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RorymPlacementInput"
      responses:
        "200":
          description: Updated manga
          content:
            application/json:
              schema:
                type: object
                required: [manga]
                properties:
                  manga:
                    $ref: "#/components/schemas/RorymManga"

  /rorym/manga/{slug}/chapters:
    get:
      operationId: getRorymChapters
      tags: [rorym]
      summary: Get chapters for a manga
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chapter list
          content:
            application/json:
              schema:
                type: object
                required: [chapters]
                properties:
                  chapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/RorymChapter"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RorymManga:
      type: object
      required: [id, slug, title, coverUrl, url, sourceId, isMostRead, genres, latestChapters]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        coverUrl:
          type: string
        url:
          type: string
        sourceId:
          type: string
        summary:
          type: string
        teamId:
          type: string
        teamName:
          type: string
        isMostRead:
          type: boolean
        genres:
          type: array
          items:
            type: string
        latestChapters:
          type: array
          items:
            type: object
            required: [number, url]
            properties:
              number:
                type: string
              url:
                type: string

    RorymPlacementInput:
      type: object
      required: [teamId, isMostRead]
      properties:
        teamId:
          type: string
          minLength: 1
        isMostRead:
          type: boolean

    RorymChapter:
      type: object
      required: [id, number, title, url, pages]
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: string
        url:
          type: string
        pages:
          type: array
          items:
            type: string
        uploadDate:
          type: string
